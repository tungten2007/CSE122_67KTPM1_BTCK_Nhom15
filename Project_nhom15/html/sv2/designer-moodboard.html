<!DOCTYPE html>
<html lang="vi">
<head>
  <base href="../../">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bảng cảm hứng Thẩm mỹ (Moodboard) · CreatorStudio</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/sv2/sv2-base.css">
  <link rel="stylesheet" href="css/sv2/sv2-navigation.css">
  <link rel="stylesheet" href="css/sv2/pages/designer.css">
  <link rel="stylesheet" href="css/sv3/team-shell.css">
  <link rel="preload" href="assets/fonts/Inter-Variable.ttf" as="font" type="font/ttf" crossorigin>
  <script src="js/shared/workspace-navigation.js"></script>
</head>
<body>
  <!-- Shell được render tự động qua App.init() -->

  <script src="js/shared/data.js"></script>
  <script src="js/shared/store.js"></script>
  <script src="js/shared/modules/navigation.js"></script>
  <script src="js/sv2/modules/ai-mood-assistant.js"></script>
  <script src="js/sv2/app-sv2.js"></script>
  <script>
    WorkspaceNavigation.ready( () => {
      App.init('moodboard', renderMoodboard);

      function renderMoodboard(){App.preserveFocus(renderMoodboardContent)}
      function renderMoodboardContent() {
        const { $, $$, esc, icon, data, user, project, banner, toast } = App;
        const main = $('#main');

        // Tìm hoặc khởi tạo moodboard cho dự án hiện tại
        let mb = data.moodboards ? data.moodboards.find(m => m.projectId === project.id) : null;
        if (!mb) {
          mb = {
            id: 'mb-' + project.id,
            projectId: project.id,
            title: `Bảng cảm hứng ${project.name}`,
            status: 'Draft',
            updatedAt: new Date().toISOString(),
            description: 'Định hướng màu sắc và phong cách thẩm mỹ dự án.',
            palette: [
              { hex: '#24473b', name: 'Xanh rừng già', role: 'Màu chủ đạo' },
              { hex: '#cbbb97', name: 'Giấy Kraft', role: 'Màu nền' },
              { hex: '#f6f1e5', name: 'Trắng kem', role: 'Tương phản' }
            ],
            keywords: ['Tự nhiên', 'Thủ công', 'Mộc mạc'],
            cards: [
              { id: 'c-init-1', title: 'Chất liệu giấy mộc', category: 'Chất liệu', image: 'assets/moodboard.svg', notes: 'Bề mặt giấy tái chế sần nhẹ.' }
            ]
          };
        }

        const isDraft = mb.status === 'Draft';
        const isPaletteReady = mb.status === 'Palette Ready';
        const isShared = mb.status === 'Shared';

        main.innerHTML = `
          ${banner()}
          
          ${App.header(
            'ĐỊNH HƯỚNG THỊ GIÁC & MÀU SẮC',
            esc(mb.title),
            esc(mb.description || 'Xây dựng bản đồ cảm hứng, bảng mã màu HEX và trích xuất từ khóa thẩm mỹ từ AI.'),
            `
              <button class="button primary" id="open-ai-modal-btn">
                ${icon('spark')} AI-3 Gợi ý phong cách & Bảng màu
              </button>
              <button class="button soft" id="add-card-btn">${icon('plus')} Thêm thẻ ảnh</button>
              <button class="button" id="share-moodboard-btn">
                ${icon('check')} ${isShared ? 'Đã chia sẻ (Shared)' : 'Chia sẻ Moodboard'}
              </button>
            `
          )}

          <!-- Thanh tiến trình trạng thái nghiệp vụ (Draft -> Palette Ready -> Shared) -->
          <div class="moodboard-header-bar">
            <div class="status-stepper">
              <div class="status-step ${isDraft ? 'active' : 'completed'}">
                <span class="step-num">1</span>
                <span>Bản nháp (Draft)</span>
              </div>
              <span class="muted">→</span>
              <div class="status-step ${isPaletteReady ? 'active' : (isShared ? 'completed' : '')}">
                <span class="step-num">2</span>
                <span>Bảng màu hoàn thiện (Palette Ready)</span>
              </div>
              <span class="muted">→</span>
              <div class="status-step ${isShared ? 'active completed' : ''}">
                <span class="step-num">3</span>
                <span>Đã chia sẻ (Shared)</span>
              </div>
            </div>

            <div class="row">
              <span class="badge ${isShared ? 'green' : (isPaletteReady ? 'purple' : 'gray')}">
                Trạng thái: ${esc(mb.status)}
              </span>
              <button class="button small" id="edit-mb-title-btn">${icon('edit')} Sửa tiêu đề</button>
            </div>
          </div>

          <!-- PHẦN 1: BẢNG MÃ MÀU HEX CHUẨN HOÁ (PALETTE MANAGER) -->
          <section class="panel" style="margin-bottom: 24px;">
            <div class="panel-title">
              <div>
                <h2>Bảng mã màu thương hiệu (HEX Palette)</h2>
                <p>Mã màu chính thức được trích xuất cho dự án ${esc(project.name)}. Nhấp để sao chép mã HEX.</p>
              </div>
              <button class="button small soft" id="add-color-btn">${icon('plus')} Thêm ô màu</button>
            </div>

            <div class="palette-container">
              ${mb.palette.map((c, idx) => `
                <div class="swatch-card">
                  <div class="swatch-preview" style="background-color: ${esc(c.hex)};">
                    <button class="copy-hex-btn" data-hex="${esc(c.hex)}" title="Sao chép ${esc(c.hex)}">
                      Copy HEX
                    </button>
                  </div>
                  <div class="swatch-info">
                    <div class="row between">
                      <span class="swatch-hex">${esc(c.hex.toUpperCase())}</span>
                      <button class="icon-button small remove-color-btn" data-index="${idx}" title="Xóa màu" style="min-width:24px; min-height:24px; padding:2px;">
                        ${icon('close')}
                      </button>
                    </div>
                    <div class="swatch-name">${esc(c.name)}</div>
                    <span class="swatch-role">${esc(c.role || 'Màu phối')}</span>
                  </div>
                </div>
              `).join('')}
            </div>

            <!-- PHẦN 2: TỪ KHÓA THẨM MỸ (AESTHETIC KEYWORDS) -->
            <div class="divider"></div>
            <div class="row between">
              <div>
                <h3>Từ khóa thẩm mỹ & Cảm xúc (Aesthetic Keywords)</h3>
                <p class="muted" style="font-size: 12px; margin-top: 2px;">Các từ khóa định vị phong cách thiết kế do Designer và AI thiết lập.</p>
              </div>
              <button class="button small" id="add-keyword-btn">${icon('plus')} Thêm từ khóa</button>
            </div>

            <div class="keyword-cloud">
              ${(mb.keywords || []).map((k, kIdx) => `
                <span class="keyword-tag removable">
                  ${esc(k)}
                  <button type="button" class="remove-keyword-btn" data-index="${kIdx}" title="Xóa từ khóa">&times;</button>
                </span>
              `).join('')}
            </div>

            ${mb.lastAIReason ? `
              <div class="ai-reasoning-box" style="margin-top: 16px;">
                <strong>Ghi chú lý do từ AI-3:</strong>
                ${esc(mb.lastAIReason)}
              </div>
            ` : ''}
          </section>

          <!-- PHẦN 3: CANVAS THẺ HÌNH ẢNH CẢM HỨNG (VISUAL CARDS) -->
          <section class="panel">
            <div class="panel-title">
              <div>
                <h2>Bảng thẻ cảm hứng trực quan (Inspiration Cards)</h2>
                <p>Các tài liệu tham chiếu về chất liệu, kiểu chữ và bố cục.</p>
              </div>
              <span class="muted" style="font-size: 12px;">Tổng cộng <strong>${mb.cards ? mb.cards.length : 0}</strong> thẻ cảm hứng</span>
            </div>

            <div class="canvas-grid">
              ${(mb.cards || []).map(card => `
                <div class="canvas-card">
                  <div class="canvas-card-media">
                    <img src="${esc(card.image)}" alt="${esc(card.title)}" onerror="this.src='assets/moodboard.svg'">
                  </div>
                  <div class="canvas-card-body">
                    <div class="row between">
                      <span class="badge purple">${esc(card.category || 'Cảm hứng')}</span>
                      <button class="icon-button small remove-card-btn" data-id="${card.id}" title="Xóa thẻ" style="color:#ef4444;">
                        ${icon('trash')}
                      </button>
                    </div>
                    <h4>${esc(card.title)}</h4>
                    <p>${esc(card.notes || 'Chưa có ghi chú định hướng.')}</p>
                  </div>
                </div>
              `).join('')}
            </div>
          </section>
        `;

        // 1. Sao chép mã HEX khi nhấp
        $$('.copy-hex-btn').forEach(btn => {
          btn.onclick = () => {
            const hex = btn.dataset.hex;
            navigator.clipboard.writeText(hex).then(() => {
              toast(`Đã sao chép mã màu ${hex} vào bộ nhớ tạm!`);
            }).catch(() => {
              toast(`Mã màu: ${hex}`);
            });
          };
        });

        // 2. Xóa ô màu
        $$('.remove-color-btn').forEach(btn => {
          btn.onclick = () => {
            const idx = Number(btn.dataset.index);
            mb.palette.splice(idx, 1);
            App.action(() => {
              Store.saveMoodboard(user.id, mb);
            }, 'Đã cập nhật bảng màu.');
          };
        });

        // 3. Thêm ô màu mới
        const addColorBtn = $('#add-color-btn');
        if (addColorBtn) {
          addColorBtn.onclick = () => {
            App.modal(
              'Thêm ô màu vào bảng phối (Palette)',
              `
                <div class="form-grid">
                  ${App.field('Mã màu HEX *', 'hex', '#2d4030', 'text', 'required placeholder="#RRGGBB"')}
                  ${App.field('Chọn màu trực quan', 'colorPicker', '#2d4030', 'color')}
                </div>
                ${App.field('Tên màu *', 'name', '', 'text', 'required placeholder="Ví dụ: Nâu hạt rang"')}
                ${App.select('Vai trò trong thiết kế', 'role', [
                  ['Màu chủ đạo', 'Màu chủ đạo'],
                  ['Màu nền / Bao bì', 'Màu nền / Bao bì'],
                  ['Màu tương phản phụ', 'Màu tương phản phụ'],
                  ['Màu chữ & Chi tiết', 'Màu chữ & Chi tiết']
                ], 'Màu chủ đạo')}
              `,
              formData => {
                const hexVal = (formData.hex || formData.colorPicker || '#000000').trim();
                mb.palette.push({
                  hex: hexVal,
                  name: formData.name.trim(),
                  role: formData.role
                });
                mb.status = 'Palette Ready';
                Store.saveMoodboard(user.id, mb);
              },
              'Thêm màu'
            );
          };
        }

        // 4. Xóa từ khóa
        $$('.remove-keyword-btn').forEach(btn => {
          btn.onclick = () => {
            const idx = Number(btn.dataset.index);
            mb.keywords.splice(idx, 1);
            App.action(() => {
              Store.saveMoodboard(user.id, mb);
            }, 'Đã xóa từ khóa.');
          };
        });

        // 5. Thêm từ khóa thủ công
        const addKeywordBtn = $('#add-keyword-btn');
        if (addKeywordBtn) {
          addKeywordBtn.onclick = () => {
            const val = prompt('Nhập từ khóa phong cách thẩm mỹ mới:');
            if (val && val.trim()) {
              mb.keywords = mb.keywords || [];
              mb.keywords.push(val.trim());
              App.action(() => {
                Store.saveMoodboard(user.id, mb);
              }, 'Đã thêm từ khóa.');
            }
          };
        }

        // 6. Xóa thẻ cảm hứng
        $$('.remove-card-btn').forEach(btn => {
          btn.onclick = () => {
            const cardId = btn.dataset.id;
            if (confirm('Bạn có chắc chắn muốn xóa thẻ cảm hứng này?')) {
              App.action(() => {
                Store.removeMoodCard(user.id, project.id, cardId);
              }, 'Đã xóa thẻ cảm hứng.');
            }
          };
        });

        // 7. Thêm thẻ ảnh mới
        const addCardBtn = $('#add-card-btn');
        if (addCardBtn) {
          addCardBtn.onclick = () => {
            App.modal(
              'Thêm thẻ cảm hứng mới (Visual Inspiration Card)',
              `
                ${App.field('Tiêu đề thẻ cảm hứng *', 'title', '', 'text', 'required minlength="2" placeholder="Ví dụ: Vân gỗ mộc / Mẫu hộp kraft"')}
                ${App.select('Phân loại *', 'category', [
                  ['Chất liệu', 'Chất liệu'],
                  ['Typography', 'Typography'],
                  ['Graphic Motif', 'Họa tiết đồ họa'],
                  ['Bố cục & Khoảng trắng', 'Bố cục & Khoảng trắng']
                ], 'Chất liệu')}
                ${App.select('Mẫu hình ảnh minh họa *', 'image', [
                  ['assets/moodboard.svg', 'Moodboard tham chiếu chuẩn (SVG)'],
                  ['assets/coffee.svg', 'Bao bì cà phê minh họa (SVG)']
                ], 'assets/moodboard.svg')}
                ${App.textField('Ghi chú định hướng', 'notes', '', 'placeholder="Mô tả cảm xúc hoặc quy cách cần áp dụng..."')}
              `,
              formData => {
                Store.addMoodCard(user.id, project.id, formData);
              },
              'Thêm vào Moodboard'
            );
          };
        }

        // 8. Đổi tiêu đề moodboard
        const editTitleBtn = $('#edit-mb-title-btn');
        if (editTitleBtn) {
          editTitleBtn.onclick = () => {
            const newTitle = prompt('Nhập tiêu đề mới cho Moodboard:', mb.title);
            if (newTitle && newTitle.trim()) {
              mb.title = newTitle.trim();
              App.action(() => {
                Store.saveMoodboard(user.id, mb);
              }, 'Đã đổi tiêu đề Moodboard.');
            }
          };
        }

        // 9. Chuyển trạng thái sang Shared
        const shareBtn = $('#share-moodboard-btn');
        if (shareBtn) {
          shareBtn.onclick = () => {
            mb.status = 'Shared';
            App.action(() => {
              Store.saveMoodboard(user.id, mb);
            }, 'Moodboard đã được chia sẻ cho toàn bộ nhóm và khách hàng!');
          };
        }

        // 10. MODAL AI-3: MOOD KEYWORD ASSISTANT (LUỒNG TRẢI NGHIỆM AI BẮT BUỘC)
        const openAIBtn = $('#open-ai-modal-btn');
        if (openAIBtn) {
          openAIBtn.onclick = () => openAIMoodAssistantModal(mb);
        }
      }

      // Hàm mở Modal AI Assistant với đầy đủ luồng: Input -> Validation -> Processing -> Result -> Explanation -> User Control & Failure Simulation
      function openAIMoodAssistantModal(mb) {
        const { $, $$, esc, icon, project, user, toast } = App;
        const d = $('#dialog');

        let defaultPrompt = `Dự án ${project.name}: Cà phê mộc nguyên bản, bao bì giấy kraft tự nhiên, phong cách Bắc Âu tối giản, tinh tế, gần gũi thiên nhiên.`;
        
        d.innerHTML = `
          <div class="ai-dialog-header">
            <div class="row between">
              <div>
                <p style="font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; opacity: 0.85;">CREATORSTUDIO AI ASSISTANT</p>
                <h2>AI-3 · Mood Keyword & Palette Assistant</h2>
                <p>Chuyển ý tưởng và brief thành bộ từ khóa thẩm mỹ & bảng màu HEX chuẩn xác.</p>
              </div>
              <button type="button" class="icon-button" data-close aria-label="Đóng" style="color:#ffffff;">${icon('close')}</button>
            </div>
          </div>

          <div class="dialog-body" id="ai-modal-body">
            <!-- BƯỚC 1: INPUT & CẤU HÌNH -->
            <div id="ai-step-input">
              <label class="field">
                <span>Mô tả ý tưởng thẩm mỹ hoặc chọn từ ngữ cảnh brief: *</span>
                <textarea id="ai-prompt-input" rows="3" placeholder="Nhập từ khóa hoặc mô tả ngắn gọn cảm xúc thương hiệu...">${esc(defaultPrompt)}</textarea>
                <small class="muted">Gợi ý: "Cà phê mộc, mộc mạc, giấy kraft, xanh rừng" hoặc "Sang trọng tối giản, cao cấp, đen vàng"</small>
              </label>

              <div class="check" style="background: #fffbeb; border: 1px solid #fef3c7; padding: 10px 14px; border-radius: 8px;">
                <input type="checkbox" id="ai-fail-checkbox">
                <label for="ai-fail-checkbox" style="font-size: 12px; color: #92400e; cursor: pointer;">
                  <strong>Mô phỏng tình huống AI thất bại (Fail State / Thiếu dữ liệu)</strong>
                  <br>Dùng để kiểm thử trạng thái khi AI chưa chắc chắn hoặc không đủ thông tin tin cậy theo yêu cầu mục 6 của đề bài.
                </label>
              </div>

              <div id="ai-input-error" class="form-error"></div>
            </div>

            <!-- BƯỚC 2: PROCESSING (SKELETON & PROGRESS) -->
            <div id="ai-step-processing" style="display: none;">
              <div class="ai-progress-box">
                <div class="ai-progress-spinner"></div>
                <h3 id="ai-progress-text">Đang phân tích ngữ cảnh thương hiệu...</h3>
                <p class="muted" style="font-size: 12px; margin-top: 6px;">AI đang đối chiếu bảng màu in ấn và trích xuất từ khóa cảm xúc.</p>
              </div>
              <div class="skeleton skeleton-box"></div>
              <div class="skeleton skeleton-text"></div>
              <div class="skeleton skeleton-text" style="width: 60%;"></div>
            </div>

            <!-- BƯỚC 3: RESULT & EXPLANATION -->
            <div id="ai-step-result" style="display: none;">
              <div class="notice success" style="margin-bottom: 16px;">
                ${icon('check')}
                <div>
                  <strong>Đã hoàn thành phân tích thẩm mỹ!</strong>
                  <p id="ai-confidence-text">Độ tin cậy cao dựa trên mô hình phong cách nghệ thuật CreatorStudio.</p>
                </div>
              </div>

              <div style="margin-bottom: 16px;">
                <h4 style="margin-bottom: 8px;">Chủ đề phong cách: <span id="ai-res-theme" style="color: var(--primary-dark); font-weight: 700;"></span></h4>
                
                <p style="font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 6px;">Bảng màu HEX đề xuất:</p>
                <div id="ai-res-palette" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px;"></div>

                <p style="font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 6px;">Bộ từ khóa thẩm mỹ gợi ý:</p>
                <div id="ai-res-keywords" class="keyword-cloud" style="margin-bottom: 14px;"></div>

                <div class="ai-reasoning-box">
                  <strong>Vì sao AI đề xuất phong cách này? (Explanation)</strong>
                  <div id="ai-res-explanation"></div>
                </div>

                <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; font-size: 12px;">
                  <p><strong>Gợi ý chất liệu in:</strong> <span id="ai-res-materials"></span></p>
                  <p style="margin-top: 4px;"><strong>Gợi ý Typography:</strong> <span id="ai-res-typography"></span></p>
                </div>
              </div>
            </div>

            <!-- BƯỚC 4: FAILURE STATE VIEW -->
            <div id="ai-step-error" style="display: none;">
              <div class="notice danger">
                ${icon('alert')}
                <div>
                  <strong>AI không thể đưa ra đề xuất tin cậy!</strong>
                  <p id="ai-error-message-text"></p>
                </div>
              </div>
              <p style="font-size: 13px; color: #475569; margin: 12px 0;">
                Theo quy chuẩn kiểm soát của người dùng: bạn có thể <strong>Thử lại</strong> với mô tả chi tiết hơn, hoặc <strong>Nhập thủ công</strong> mã màu vào Moodboard mà không cần thông qua AI.
              </p>
            </div>
          </div>

          <footer class="dialog-foot" id="ai-modal-foot">
            <button type="button" class="button" data-close>Đóng</button>
            <button type="button" class="button primary" id="ai-generate-btn">
              ${icon('spark')} Bắt đầu sinh gợi ý
            </button>
          </footer>
        `;

        $$('[data-close]', d).forEach(b => b.onclick = () => d.close());

        let generatedData = null;

        const inputStep = $('#ai-step-input');
        const processingStep = $('#ai-step-processing');
        const resultStep = $('#ai-step-result');
        const errorStep = $('#ai-step-error');
        const foot = $('#ai-modal-foot');
        const errElem = $('#ai-input-error');

        // Bấm nút "Bắt đầu sinh gợi ý"
        $('#ai-generate-btn').onclick = async () => {
          const promptVal = $('#ai-prompt-input').value;
          const shouldFail = $('#ai-fail-checkbox').checked;

          if (!promptVal || promptVal.trim().length < 5) {
            errElem.textContent = 'Vui lòng nhập mô tả ít nhất 5 ký tự.';
            return;
          }
          errElem.textContent = '';

          // Chuyển sang Processing View
          inputStep.style.display = 'none';
          resultStep.style.display = 'none';
          errorStep.style.display = 'none';
          processingStep.style.display = 'block';
          foot.innerHTML = `<button type="button" class="button" disabled>AI đang tính toán...</button>`;

          // Mô phỏng các bước tiến trình
          const progressText = $('#ai-progress-text');
          setTimeout(() => { if (progressText) progressText.textContent = 'Đang trích xuất mã màu HEX tương phản...'; }, 500);
          setTimeout(() => { if (progressText) progressText.textContent = 'Đang cấu trúc bộ từ khóa cảm xúc & chất liệu...'; }, 1000);

          try {
            generatedData = await AIMoodAssistant.generateSuggestion(promptVal, shouldFail);

            // Chuyển sang Result View
            processingStep.style.display = 'none';
            resultStep.style.display = 'block';

            $('#ai-res-theme').textContent = generatedData.themeName;
            $('#ai-confidence-text').textContent = generatedData.confidence;
            $('#ai-res-explanation').textContent = generatedData.explanation;
            $('#ai-res-materials').textContent = generatedData.materials;
            $('#ai-res-typography').textContent = generatedData.typography;

            // Render Palette
            $('#ai-res-palette').innerHTML = generatedData.palette.map(c => `
              <div style="background: ${c.hex}; height: 50px; border-radius: 8px; border: 1px solid rgba(0,0,0,0.1); display: flex; align-items: flex-end; padding: 4px;">
                <span style="font-size: 10px; font-weight: bold; background: rgba(255,255,255,0.85); padding: 1px 4px; border-radius: 4px;">${c.hex}</span>
              </div>
            `).join('');

            // Render Keywords
            $('#ai-res-keywords').innerHTML = generatedData.keywords.map(k => `
              <span class="keyword-tag">${esc(k)}</span>
            `).join('');

            // Đổi Footer sang bộ nút User Control (Accept / Edit / Reject / Regenerate)
            foot.innerHTML = `
              <button type="button" class="button" id="ai-reject-btn">Từ chối (Reject)</button>
              <button type="button" class="button" id="ai-regen-btn">${icon('spark')} Tạo lại (Regenerate)</button>
              <button type="button" class="button primary" id="ai-accept-btn">${icon('check')} Chấp nhận & Áp dụng</button>
            `;

            $('#ai-reject-btn').onclick = () => d.close();
            $('#ai-regen-btn').onclick = () => {
              inputStep.style.display = 'block';
              resultStep.style.display = 'none';
              foot.innerHTML = `
                <button type="button" class="button" data-close>Hủy</button>
                <button type="button" class="button primary" id="ai-generate-btn">${icon('spark')} Bắt đầu sinh lại</button>
              `;
              $$('[data-close]', d).forEach(b => b.onclick = () => d.close());
              $('#ai-generate-btn').onclick = () => $('#open-ai-modal-btn').click();
            };

            $('#ai-accept-btn').onclick = () => {
              Store.applyAIPalette(user.id, project.id, {
                palette: generatedData.palette,
                keywords: generatedData.keywords,
                reason: generatedData.explanation
              });
              d.close();
              App.refresh();
              toast('Đã áp dụng toàn bộ bảng màu và từ khóa từ AI vào Moodboard!');
            };

          } catch (err) {
            // Chuyển sang Failure View
            processingStep.style.display = 'none';
            errorStep.style.display = 'block';
            $('#ai-error-message-text').textContent = err.message;

            foot.innerHTML = `
              <button type="button" class="button" data-close>Đóng</button>
              <button type="button" class="button" id="ai-manual-btn">Nhập thủ công</button>
              <button type="button" class="button primary" id="ai-retry-btn">Thử lại (Retry)</button>
            `;

            $$('[data-close]', d).forEach(b => b.onclick = () => d.close());
            $('#ai-retry-btn').onclick = () => {
              $('#ai-fail-checkbox').checked = false;
              errorStep.style.display = 'none';
              inputStep.style.display = 'block';
              foot.innerHTML = `
                <button type="button" class="button" data-close>Đóng</button>
                <button type="button" class="button primary" id="ai-generate-btn">${icon('spark')} Bắt đầu sinh gợi ý</button>
              `;
              $$('[data-close]', d).forEach(b => b.onclick = () => d.close());
              $('#ai-generate-btn').onclick = () => $('#open-ai-modal-btn').click();
            };

            $('#ai-manual-btn').onclick = () => {
              d.close();
              $('#add-color-btn').click();
            };
          }
        };

        d.showModal();
      }
    });
  </script>
</body>
</html>
