<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Phiên bản Thiết kế (Version Management) · CreatorStudio</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/sv2-base.css">
  <link rel="stylesheet" href="css/sv2-navigation.css">
  <link rel="stylesheet" href="css/pages/designer.css">
</head>
<body>
  <!-- Shell được render tự động qua App.init() -->

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/modules/navigation.js"></script>
  <script src="js/app-sv2.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let currentFilterStatus = 'all';

      App.init('versions', renderVersionManagement);

      function renderVersionManagement(){App.preserveFocus(renderVersionManagementContent)}
      function renderVersionManagementContent() {
        const { $, $$, esc, icon, data, user, project, banner, date, toast } = App;
        const main = $('#main');

        // Lấy danh sách phiên bản của dự án hiện tại, sắp xếp mới nhất lên đầu
        let versions = data.versions.filter(v => v.projectId === project.id);
        versions.sort((a, b) => (b.versionNum || 0) - (a.versionNum || 0));

        if (currentFilterStatus !== 'all') {
          versions = versions.filter(v => v.status === currentFilterStatus);
        }

        const pattern = data.settings?.versionPattern || '{project}-{asset}-v{number}';

        main.innerHTML = `
          ${banner()}

          ${App.header(
            'LỊCH SỬ PHIÊN BẢN & SỬA ĐỔI',
            'Kiểm soát Phiên bản Thiết kế',
            'Tải lên phiên bản mới, cập nhật changelog, tích chọn checklist nghiệm thu và nộp duyệt nội bộ.',
            `
              <button class="button primary" id="upload-version-btn">
                ${icon('plus')} Tải lên phiên bản mới
              </button>
            `
          )}

          <!-- Thông tin cấu hình quy tắc phiên bản studio -->
          <div class="notice" style="margin-bottom: 24px;">
            ${icon('settings')}
            <div>
              <strong>Quy tắc đặt mã phiên bản Studio: <code>${esc(pattern)}</code></strong>
              <p>Mã phiên bản được tự động sinh dựa trên mã dự án (<strong>${esc(project.code)}</strong>), loại tài sản và số thứ tự phiên bản tăng dần.</p>
            </div>
          </div>

          <!-- Toolbar lọc trạng thái -->
          <div class="toolbar">
            <select id="status-filter">
              <option value="all" ${currentFilterStatus === 'all' ? 'selected' : ''}>Tất cả trạng thái</option>
              <option value="Draft" ${currentFilterStatus === 'Draft' ? 'selected' : ''}>Bản nháp (Draft)</option>
              <option value="Internal Review" ${currentFilterStatus === 'Internal Review' ? 'selected' : ''}>Chờ duyệt nội bộ (Internal Review)</option>
              <option value="Client Review" ${currentFilterStatus === 'Client Review' ? 'selected' : ''}>Khách hàng duyệt (Client Review)</option>
              <option value="Changes Requested" ${currentFilterStatus === 'Changes Requested' ? 'selected' : ''}>Yêu cầu sửa đổi (Changes Requested)</option>
              <option value="Approved" ${currentFilterStatus === 'Approved' ? 'selected' : ''}>Đã phê duyệt (Approved)</option>
              <option value="Archived" ${currentFilterStatus === 'Archived' ? 'selected' : ''}>Đã lưu trữ (Archived)</option>
            </select>
            <span class="toolbar-count">Tổng cộng <strong>${versions.length}</strong> phiên bản</span>
          </div>

          <!-- Danh sách các phiên bản -->
          <div class="version-timeline">
            ${versions.length === 0 ? App.empty('Chưa có phiên bản nào', 'Hãy tải lên phiên bản v1 đầu tiên cho dự án này.') : versions.map((v, index) => {
              const isCurrent = index === 0;
              const isDraft = v.status === 'Draft';
              const isChangesRequested = v.status === 'Changes Requested';
              const isInternalReview = v.status === 'Internal Review';
              const isClientReview = v.status === 'Client Review';
              const isApproved = v.status === 'Approved';
              const isArchived = v.status === 'Archived';

              let badgeColor = 'gray';
              if (isApproved) badgeColor = 'green';
              else if (isChangesRequested) badgeColor = 'high';
              else if (isInternalReview || isClientReview) badgeColor = 'purple';
              else if (isDraft) badgeColor = 'yellow';

              // Tìm comment hoặc note liên quan đến phiên bản này
              const vComments = (data.comments || []).filter(c => c.versionId === v.id);
              const vNotes = (data.notes || []).filter(n => n.versionId === v.id);

              return `
                <div class="version-card ${isCurrent ? 'current' : ''}">
                  <div class="version-thumb">
                    <img src="${esc(v.image || 'assets/coffee.svg')}" alt="${esc(v.name)}" onerror="this.src='assets/coffee.svg'">
                  </div>

                  <div class="version-details">
                    <div class="version-head-row">
                      <div class="row" style="gap: 8px; flex-wrap: wrap;">
                        <span class="version-name-tag">${esc(v.code || v.name)}</span>
                        <h3 style="font-size: 16px;">${esc(v.name)}</h3>
                        <span class="badge ${badgeColor}">${esc(v.status)}</span>
                        ${isCurrent ? '<span class="badge blue">Mới nhất</span>' : ''}
                      </div>

                      <div class="row">
                        ${isDraft || isChangesRequested ? `
                          <button class="button small primary submit-review-btn" data-id="${v.id}">
                            ${icon('check')} Nộp duyệt nội bộ
                          </button>
                        ` : ''}

                        ${isDraft ? `
                          <button class="button small edit-version-btn" data-id="${v.id}">${icon('edit')} Sửa</button>
                          <button class="button small danger delete-version-btn" data-id="${v.id}">${icon('trash')} Xóa nháp</button>
                        ` : ''}

                        ${!isArchived ? `
                          <button class="button small archive-version-btn" data-id="${v.id}" title="Lưu trữ phiên bản">Lưu trữ</button>
                        ` : ''}
                      </div>
                    </div>

                    <p class="muted" style="font-size: 12px;">
                      Tạo ngày: ${new Date(v.createdAt).toLocaleString('vi-VN')} · Người thực hiện: ${data.users.find(u => u.id === v.author)?.name || 'An Nguyễn'}
                    </p>

                    <!-- Changelog -->
                    <div class="version-changelog">
                      <strong>Nhật ký thay đổi (Changelog):</strong>
                      <p style="margin-top: 4px;">${esc(v.changelog || 'Không có mô tả thay đổi.')}</p>
                    </div>

                    <!-- Checklist nghiệm thu hoàn thành phản hồi -->
                    <div class="version-checklist-view">
                      <span class="checklist-badge ${v.checkFeedback ? 'done' : 'pending'}">
                        ${icon('check')} Đã xử lý phản hồi trước
                      </span>
                      <span class="checklist-badge ${v.checkSpec ? 'done' : 'pending'}">
                        ${icon('check')} Đúng quy chuẩn kích thước & in ấn
                      </span>
                      <span class="checklist-badge ${v.checkExport ? 'done' : 'pending'}">
                        ${icon('check')} Đã xuất file asset hoàn chỉnh
                      </span>
                    </div>

                    <!-- Danh sách phản hồi hoặc ghi chú gắn với phiên bản nếu có -->
                    ${vComments.length > 0 || vNotes.length > 0 ? `
                      <div style="background: #fffdf5; border: 1px solid #fef3c7; border-radius: 8px; padding: 10px 14px; margin-top: 12px; font-size: 12px;">
                        <strong style="color: #92400e;">Góp ý từ Khách hàng & Trưởng nhóm:</strong>
                        <ul style="margin: 4px 0 0 16px; padding: 0; color: #78350f;">
                          ${vComments.map(c => `<li><strong>${esc(c.author)}:</strong> ${esc(c.text)}</li>`).join('')}
                          ${vNotes.map(n => `<li><strong>Ghi chú nội bộ:</strong> ${esc(n.text)} ${n.resolved ? '(Đã xử lý)' : '(Chưa xử lý)'}</li>`).join('')}
                        </ul>
                      </div>
                    ` : ''}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;

        // 1. Lọc theo trạng thái
        const statusFilter = $('#status-filter');
        if (statusFilter) {
          statusFilter.onchange = e => {
            currentFilterStatus = e.target.value;
            renderVersionManagement();
          };
        }

        // 2. Upload / Tạo phiên bản mới Modal
        const uploadBtn = $('#upload-version-btn');
        if (uploadBtn) {
          uploadBtn.onclick = () => {
            const nextNum = Math.max(0, ...data.versions.filter(v => v.projectId === project.id && v.assetType === 'BaoBi').map(v => Number(v.versionNum) || 0)) + 1;
            const autoCode = Store.computeVersionCode(data, project.id, 'BaoBi', nextNum);

            App.modal(
              'Tải lên phiên bản thiết kế mới',
              `
                <div class="notice" style="margin-bottom: 16px;">
                  Mã phiên bản tự động: <strong id="version-code-preview">${esc(autoCode)}</strong>
                </div>

                ${App.field('Tên hiển thị phiên bản *', 'name', `${project.name} · Phiên bản ${nextNum}`, 'text', 'required minlength="3"')}
                ${App.select('Loại tài sản sáng tạo *', 'assetType', [
                  ['BaoBi', 'Bao bì sản phẩm (Packaging)'],
                  ['Logo', 'Logo & Biểu trưng'],
                  ['AnPham', 'Ấn phẩm truyền thông (Banner/Post)']
                ], 'BaoBi')}

                ${App.select('Chọn hình ảnh mockup thiết kế *', 'image', [
                  ['assets/coffee.svg', 'Bao bì cà phê minh họa chuẩn (SVG)'],
                  ['assets/moodboard.svg', 'Bản mẫu moodboard & đồ họa (SVG)']
                ], 'assets/coffee.svg')}
                <label class="field"><span>Tải ảnh thiết kế (PNG/JPEG/WebP, tối đa 1 MB; tùy chọn)</span><input type="file" name="designFile" accept="image/png,image/jpeg,image/webp"></label>

                ${App.textField('Nhật ký thay đổi (Changelog) *', 'changelog', '', 'required minlength="5" placeholder="Ghi rõ những điểm đã chỉnh sửa hoặc cải tiến so với phiên bản trước..."')}

                <p style="font-size: 13px; font-weight: 600; margin: 14px 0 6px;">Checklist hoàn thành trước khi nộp duyệt:</p>
                <label class="check">
                  <input type="checkbox" name="checkFeedback" checked>
                  <span>Đã kiểm tra và giải quyết toàn bộ góp ý từ phiên bản trước</span>
                </label>
                <label class="check">
                  <input type="checkbox" name="checkSpec" checked>
                  <span>Đã kiểm tra quy chuẩn in ấn, tỷ lệ kích thước và độ phân giải</span>
                </label>
                <label class="check">
                  <input type="checkbox" name="checkExport" checked>
                  <span>Đã chuẩn bị đầy đủ file xuất bản (Export asset ready)</span>
                </label>
              `,
              async (formData, form) => {
                const file = form.elements.designFile.files[0];
                if (file) {
                  if (!['image/png', 'image/jpeg', 'image/webp'].includes(file.type) || file.size > 1024 * 1024) throw new Error('Chọn ảnh PNG/JPEG/WebP tối đa 1 MB.');
                  formData.image = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = () => reject(new Error('Không đọc được ảnh. Hãy thử lại.'));
                    reader.readAsDataURL(file);
                  });
                }
                Store.saveVersion(user.id, {
                  ...formData,
                  projectId: project.id,
                });
              },
              'Tạo bản nháp phiên bản'
            );
            $('#dialog-form').elements.assetType.onchange = e => {
              const type = e.target.value;
              const number = Math.max(0, ...Store.get().versions.filter(v => v.projectId === project.id && v.assetType === type).map(v => Number(v.versionNum) || 0)) + 1;
              $('#version-code-preview').textContent = Store.computeVersionCode(Store.get(), project.id, type, number);
            };
          };
        }

        // 3. Nộp duyệt nội bộ
        $$('.submit-review-btn').forEach(btn => {
          btn.onclick = () => {
            const vid = btn.dataset.id;
            if (confirm('Bạn có chắc chắn muốn nộp phiên bản này để Trưởng nhóm (Linh Hà) duyệt nội bộ?')) {
              App.action(() => {
                Store.submitVersionForReview(user.id, vid);
              }, 'Đã nộp phiên bản để duyệt nội bộ thành công!');
            }
          };
        });

        // 4. Sửa phiên bản nháp
        $$('.edit-version-btn').forEach(btn => {
          btn.onclick = () => {
            const vid = btn.dataset.id;
            const targetV = data.versions.find(x => x.id === vid);
            if (!targetV) return;

            App.modal(
              `Chỉnh sửa bản nháp: ${targetV.name}`,
              `
                ${App.field('Tên hiển thị phiên bản *', 'name', targetV.name, 'text', 'required minlength="3"')}
                ${App.textField('Nhật ký thay đổi (Changelog) *', 'changelog', targetV.changelog, 'required minlength="5"')}
                <label class="check">
                  <input type="checkbox" name="checkFeedback" ${targetV.checkFeedback ? 'checked' : ''}>
                  <span>Đã giải quyết góp ý phiên bản trước</span>
                </label>
                <label class="check">
                  <input type="checkbox" name="checkSpec" ${targetV.checkSpec ? 'checked' : ''}>
                  <span>Đúng quy chuẩn kích thước</span>
                </label>
                <label class="check">
                  <input type="checkbox" name="checkExport" ${targetV.checkExport ? 'checked' : ''}>
                  <span>Đã xuất asset đầy đủ</span>
                </label>
              `,
              formData => {
                Store.saveVersion(user.id, {
                  ...formData,
                  id: targetV.id,
                  projectId: targetV.projectId
                });
              },
              'Lưu thay đổi'
            );
          };
        });

        // 5. Xóa bản nháp
        $$('.delete-version-btn').forEach(btn => {
          btn.onclick = () => {
            const vid = btn.dataset.id;
            if (confirm('Bạn có chắc chắn muốn xóa bản nháp phiên bản này?')) {
              App.action(() => {
                Store.deleteVersion(user.id, vid);
              }, 'Đã xóa bản nháp phiên bản.');
            }
          };
        });

        // 6. Lưu trữ phiên bản
        $$('.archive-version-btn').forEach(btn => {
          btn.onclick = () => {
            const vid = btn.dataset.id;
            if (confirm('Chuyển phiên bản này sang kho lưu trữ (Archived)?')) {
              App.action(() => {
                Store.archiveVersion(user.id, vid);
              }, 'Đã chuyển phiên bản sang kho lưu trữ.');
            }
          };
        });
      }
    });
  </script>
</body>
</html>
